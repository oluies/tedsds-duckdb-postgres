name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tedsds
          POSTGRES_PASSWORD: tedsds
          POSTGRES_DB: tedsds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tedsds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_DSN: postgresql://tedsds:tedsds@localhost:5432/tedsds

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB postgres extension
        run: |
          uv run python -c "import duckdb; con = duckdb.connect(); con.install_extension('postgres'); con.load_extension('postgres'); print('postgres extension OK')"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -v
