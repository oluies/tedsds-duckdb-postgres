services:
  postgres:
    image: dhi.io/postgres:18-alpine3.23-dev
    environment:
      POSTGRES_USER: tedsds
      POSTGRES_PASSWORD: tedsds
      POSTGRES_DB: tedsds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedsds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
