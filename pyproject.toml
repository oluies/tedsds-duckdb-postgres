[project]
name = "tedsds"
version = "0.1.0"
description = "Predictive maintenance (NASA turbofan) on Postgres + DuckDB + scikit-learn"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Örjan Lundberg", email = "orjan.lundberg@gmail.com" }]

dependencies = [
    "duckdb>=1.1.3",
    "psycopg[binary]>=3.2.3",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "joblib>=1.4.2",
    "typer>=0.15.1",
    "pydantic-settings>=2.6.1",
    "jinja2>=3.1.4",
]

[project.scripts]
tedsds = "tedsds.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-postgresql>=6.1.1",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tedsds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
